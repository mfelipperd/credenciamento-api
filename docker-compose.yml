version: '3.8'

services:
  mysql:
    image: mysql:8.0
    container_name: mysql_credenciamento
    restart: always
    env_file:
      - .env
    ports:
      - '3306:3306'
    volumes:
      - mysql_data:/var/lib/mysql
      - ./backups:/backups # Volume para armazenar backups
    command: --default-authentication-plugin=mysql_native_password

  api:
    build:
      context: .
      args:
        NODE_ENV: development
    container_name: nest_api_credenciamento
    restart: always
    depends_on:
      - mysql
    env_file:
      - .env
    environment:
      NODE_ENV: development
    ports:
      - '8000:8000'
    volumes:
      - .:/app
    command: npm run start:dev

volumes:
  mysql_data:
  mysql_backups:
